name: Stiebel Eltron REST service

# The repository's other workflows build the Maven reactor; this one covers the
# standalone Python service under stiebel-eltron-rest/, which they do not touch.
on:
  push:
    paths:
      - 'stiebel-eltron-rest/**'
      - 'bundles/org.openhab.binding.stiebelheatpump/src/main/resources/HeatpumpConfig/**'
      - '.github/workflows/stiebel-eltron-rest.yml'
  pull_request:
    paths:
      - 'stiebel-eltron-rest/**'
      - 'bundles/org.openhab.binding.stiebelheatpump/src/main/resources/HeatpumpConfig/**'
      - '.github/workflows/stiebel-eltron-rest.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stiebel-eltron-rest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) and the version the Docker image uses.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        # Includes the guard that device_configs/ has not drifted from the
        # binding's own HeatpumpConfig XML files.
        run: pytest -q
